name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: LeonardoEliasSoares
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-snake.svg?palette=github-dark&color_snake=%2358A6FF&color_dots=%23161B22,%230D419D,%231D5BD8,%233B82F6,%2360A5FA

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
